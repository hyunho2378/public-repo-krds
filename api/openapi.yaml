    "title": "공공 저장소 리빌딩 API",
    "version": "0.2.0",
    "description": "공개 목록 스냅샷 BM25 검색, 규칙 기반 분석, 요청별 GitLab 공개 조회 및 캐시, SQLite 저장. draft/needsReview/not-connected 상태를 실제 분석·승인으로 오인하지 않는다. 개발 로그인 기록은 is_dev로 별도 분리하며 mock:true로 표시한다."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:5732"
    }
  ],
  "paths": {
    "/api/v1/search": {
      "post": {
        "summary": "업무 문장 검색",
        "x-feature-id": "F-01",
        "x-status": "implemented-with-limitations",
        "x-owner": "product-api",
        "parameters": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "query": {
                    "type": "string",
                    "example": "string"
                  },
                  "filters": {
                    "type": "object",
                    "properties": {},
                    "additionalProperties": false
                  }
                },
                "additionalProperties": false,
                "required": [
                  "query",
                  "filters"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "처리 결과. 자동 추출/규칙 판정/미연결 여부는 data 상태를 확인한다.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "mock",
                    "feature",
                    "state",
                    "data"
                  ],
                  "properties": {
                    "mock": {
                      "type": "boolean",
                      "description": "개발 로그인 시험 기록만 true"
                    },
                    "development": {
                      "type": "boolean"
                    },
                    "feature": {
                      "type": "string"
                    },
                    "state": {
                      "type": "string",
                      "enum": [
                        "Ideal",
                        "Empty",
                        "Min",
                        "Max",
                        "Error"
                      ]
                    },
                    "data": {
                      "type": "object",
                      "additionalProperties": true
                    },
                    "notice": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Required input missing"
          },
          "401": {
            "description": "Production authentication required"
          },
          "403": {
            "description": "Production project owner permission required"
          },
          "429": {
            "description": "조회 한도, 이후 재시도"
          },
          "503": {
            "description": "필수 외부 연동 미설정"
          }
        },
        "description": " 실제 상태와 제한은 응답 data.notice, data.status, needsReview를 확인한다."
      }
    },
